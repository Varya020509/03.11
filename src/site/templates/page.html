<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет // Терминал</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: "Courier New", monospace;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
        }

        .hacker-box {
            border: 3px double #00ff00;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            background-color: #050505;
        }

        .cat-ascii {
            white-space: pre;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #00ff00;
            text-align: center;
            display: block;
        }

        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        .desc {
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }

        .logs {
            border: 1px solid #00ff00;
            padding: 15px;
            background-color: #000000;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .log-item {
            margin-bottom: 8px;
        }

        .log-item span {
            color: #ffffff;
            font-weight: bold;
        }

        .btn-block {
            text-align: center;
        }

        .back-btn {
            color: #000000;
            background-color: #00ff00;
            text-decoration: none;
            padding: 8px 25px;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            border: 1px solid #00ff00;
            text-transform: uppercase;
        }

        .back-btn:hover {
            color: #00ff00;
            background-color: #000000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="hacker-box">
        <span class="cat-ascii">
 /\_/\  
( o.o ) 
 > ^ <  
        </span>

        <h1>[ УСПЕШНАЯ АВТОРИЗАЦИЯ ]</h1>
        <p class="desc">Сессия активна. Данные профиля успешно импортированы из базы данных.</p>
        
        <div class="logs">
            <div class="log-item"><span>USER_NAME:</span> {{ name }}</div>
            <div class="log-item"><span>USER_EMAIL:</span> {{ email }}</div>
            <div class="log-item"><span>PASS_HASH:</span> {{ password }}</div>
            <div class="log-item"><span>CURRENT_BAL:</span> {{ balance }} RUB</div>
        </div>

        <div class="btn-block">
            <a href="/login" class="back-btn">> ВЫЙТИ <</a>
        </div>
    </div>

</body>
</html>
